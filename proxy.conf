# Proxy Server Configuration
# This is an INI-style configuration file for the HTTP Proxy server.
# Values can be overridden by environment variables or command-line arguments.

# Network settings
port = 8080
bind_address = 0.0.0.0
enable_ipv6 = false

# Limits
max_clients = 10
max_bytes = 4096
max_cache_size = 209715200   # 200 MB in bytes
max_element_size = 10240     # 10 KB in bytes

# Caching
cache_enabled = true
cache_dir = /var/cache/proxy

# Security
enable_auth = false
auth_file = /etc/proxy/passwd
blocklist_file = /etc/proxy/blocklist.txt

# Logging
log_file = /var/log/proxy.log
log_level = INFO
log_rotation = true
log_max_size_mb = 10

# Throttling
enable_throttling = false
rate_limit_rps = 100
rate_limit_burst = 20
bandwidth_limit_kbps = 1000

# Features
enable_https = true
enable_http2 = false
enable_filter = false
